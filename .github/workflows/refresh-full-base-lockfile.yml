name: Refresh full-base lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - pnpm-workspace.yaml
      - powerfarm/**/package.json
      - .github/workflows/refresh-full-base-lockfile.yml

permissions:
  contents: write

concurrency:
  group: refresh-full-base-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh lockfile for full Cloudflare OS plus Powerfarm extensions
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile if required
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile already current"
            exit 0
          fi
          git config user.name "powerfarm-baseline-bot"
          git config user.email "powerfarm-baseline-bot@users.noreply.github.com"
          git commit -m "chore: lock full Cloudflare OS plus Powerfarm workspace"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
