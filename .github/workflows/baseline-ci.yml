name: Powerfarm full-base CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"

jobs:
  baseline:
    runs-on: ubuntu-latest
    # Upstream explicitly caps its build+test job because a leaked child process can keep
    # node --test alive indefinitely. Powerfarm adds extension packages and dry-runs, so keep
    # a bounded but slightly wider window instead of GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Prove canonical source shape before installing dependencies
        run: node powerfarm/scripts/assert-clean-baseline.mjs

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      # Match the complete Cloudflare OS CI contract: build/codegen/type-check before tests.
      # Some tests consume generated artifacts and upstream intentionally runs this first.
      - name: Build and type-check full Cloudflare OS and Powerfarm
        run: pnpm build

      - name: Full Cloudflare OS and Powerfarm tests
        run: pnpm test

      - name: Repository lint
        run: pnpm lint:check -- --format=unix

      - name: Type-check repository scripts
        run: pnpm types:scripts

      - name: Wrangler dry-run every core and Powerfarm Worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/powerfarm-wrangler-dry
          mkdir -p /tmp/powerfarm-wrangler-dry
          for config in packages/*/wrangler.jsonc powerfarm/*/wrangler.jsonc; do
            dir="$(dirname "$config")"
            name="$(basename "$dir")"
            out="/tmp/powerfarm-wrangler-dry/$name"
            mkdir -p "$out"
            echo "dry-run: $dir"
            (cd "$dir" && pnpm exec wrangler deploy --dry-run --outdir "$out")
          done

      - name: Re-prove topology after generated build steps
        run: node powerfarm/scripts/assert-clean-baseline.mjs

      - name: Patch hygiene
        run: git diff --check
