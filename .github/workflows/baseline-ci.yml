name: Baseline CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable

      - name: REGRA 0 - official Cloudflare OS upstream
        run: node scripts/guards/check-upstream-source.mjs
      - name: REGRA 0a - sealed official starter deploy library
        run: node scripts/guards/check-starter-source.mjs

      - run: pnpm install --frozen-lockfile
      - name: REGRA 0b - Powerfarm platform contract
        run: node scripts/guards/check-platform-contract.mjs
      - run: pnpm --dir cloudflare-os install --frozen-lockfile

      - name: REGRA 2 - destructive migrations require approval
        run: node scripts/guards/check-migrations.mjs
      - name: Generate configs and full Wrangler dry-run
        run: pnpm check
      - name: Expected state matches generated configs
        run: node scripts/derive-expected.mjs --check
      - name: REGRA 3 - bindings contract
        run: node scripts/guards/check-bindings.mjs
      - name: REGRA 4 - admin contract
        run: node scripts/guards/check-admins.mjs

      - name: Deterministic tests
        run: pnpm test

      - name: Migration safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f state/migration-source.json
          test -f state/legacy-production-baseline.json
          test ! -f .github/workflows/deploy.yml
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          const migration = JSON.parse(readFileSync("state/migration-source.json", "utf8"));
          if (typeof migration.productionBaselineActivated !== "boolean") {
            throw new Error("productionBaselineActivated must be boolean");
          }
          if (migration.productionDeployControllerEnabled !== false) {
            throw new Error("steady-state deploy controller must remain disabled during migration");
          }
          const hasAnchor = existsSync("state/ultimo-deploy.json");
          if (hasAnchor !== migration.productionBaselineActivated) {
            throw new Error("ultimo-deploy presence must match productionBaselineActivated");
          }
          if (hasAnchor) {
            const anchor = JSON.parse(readFileSync("state/ultimo-deploy.json", "utf8"));
            if (!/^[0-9a-f]{40}$/i.test(anchor.commit ?? "")) {
              throw new Error("new production anchor must reference a Git commit");
            }
            if (anchor.commit === "60f3f34097a38a29eac6fd91ef6e5fa0958d23d4") {
              throw new Error("legacy Git SHA cannot become the active anchor in the new repository");
            }
          }
          NODE
          test "$(git ls-files -s cloudflare-os | awk '{print $1":"$2}')" = "160000:bf7f762d7fa73553284d731ab6a978d3ea17be24"
          test -z "$(git ls-files 'packages/*/dist/**' 'packages/*/worker-configuration.d.ts')"
      - name: Patch hygiene
        run: git diff --check
