name: Cloudflare credential preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - state/credential-preflight-request.json

concurrency:
  group: cloudflare-credential-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.state.outputs.verify }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          const request = JSON.parse(readFileSync("state/credential-preflight-request.json", "utf8"));
          console.log(`verify=${request.requested === true ? "true" : "false"}`);
          NODE

  preflight:
    needs: gate
    if: needs.gate.outputs.verify == 'true'
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Required secret names are populated
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_READONLY: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
          CLOUDFLARE_API_TOKEN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PREFLIGHT_STAGE=secret-presence" >> "$GITHUB_ENV"
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "missing required secret: CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN_READONLY" || { echo "missing required secret: CLOUDFLARE_API_TOKEN_READONLY" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN_DEPLOY" || { echo "missing required secret: CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Read-only token can read Worker deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PREFLIGHT_STAGE=readonly-api" >> "$GITHUB_ENV"
          node scripts/check-cloudflare-api-read.mjs --worker powerfarm-backend

      - name: Deployment token is valid for the same account and can read Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PREFLIGHT_STAGE=deployment-token-api" >> "$GITHUB_ENV"
          node scripts/check-cloudflare-api-read.mjs --worker powerfarm-backend

      - name: Live production still equals historical eight-Worker baseline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PREFLIGHT_STAGE=historical-baseline" >> "$GITHUB_ENV"
          node scripts/verify-legacy-production.mjs

      - name: Record non-secret credential preflight proof
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PREFLIGHT_STAGE=proof-commit" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const migration = JSON.parse(readFileSync("state/migration-source.json", "utf8"));
          const requestPath = "state/credential-preflight-request.json";
          const request = JSON.parse(readFileSync(requestPath, "utf8"));
          const now = new Date().toISOString();
          const proof = {
            kind: "cloudflare-credential-preflight",
            verifiedAt: now,
            environment: "producao",
            canonicalRuntimeBaselineCommit: migration.canonicalRuntimeBaselineCommit,
            accountCredentialPresent: true,
            readOnlyTokenApiRead: true,
            deploymentTokenApiRead: true,
            deploymentTokenWriteScopeVerified: false,
            historicalEightWorkerBaselineStillExact: true
          };
          request.requested = false;
          request.completedAt = now;
          writeFileSync("state/cloudflare-credential-preflight.json", JSON.stringify(proof, null, 2) + "\n");
          writeFileSync(requestPath, JSON.stringify(request, null, 2) + "\n");
          NODE
          git config user.name powerfarm-ci
          git config user.email ci@powerfarm.app
          git add state/cloudflare-credential-preflight.json state/credential-preflight-request.json
          git commit -m "chore: record Cloudflare credential preflight"
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Report preflight failure without exposing credentials
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create \
            --title "Cloudflare credential preflight failed: ${PREFLIGHT_STAGE:-unknown}" \
            --body "The read-only production credential preflight failed at stage \`${PREFLIGHT_STAGE:-unknown}\`. No Cloudflare write was attempted. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
