name: Bootstrap canonical baseline

on:
  push:
    branches:
      - baseline/cloudflare-os-bf7f762
    paths:
      - .github/workflows/bootstrap-baseline.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-baseline.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: baseline/cloudflare-os-bf7f762
          submodules: false
          persist-credentials: true

      - name: Fetch reviewed legacy snapshot
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/powerfarm-legacy
          git -C /tmp/powerfarm-legacy remote add origin https://github.com/powerfarm/OLD-platform-NAO-USAR-os.git
          git -C /tmp/powerfarm-legacy fetch --depth=1 origin 350dc661bdd1c4d831e5eb1f6b9224a9050de88e
          git -C /tmp/powerfarm-legacy checkout --detach FETCH_HEAD
          test "$(git -C /tmp/powerfarm-legacy rev-parse HEAD)" = "350dc661bdd1c4d831e5eb1f6b9224a9050de88e"

      - name: Reapply Powerfarm-owned source
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/powerfarm-legacy

          cp "$SRC/.gitignore" .gitignore
          cp "$SRC/LICENSE" LICENSE
          cp "$SRC/deployment.jsonc" deployment.jsonc
          cp "$SRC/package.json" package.json
          cp "$SRC/pnpm-lock.yaml" pnpm-lock.yaml
          cp "$SRC/pnpm-workspace.yaml" pnpm-workspace.yaml

          rm -rf docs examples packages scripts state
          cp -a "$SRC/docs" docs
          cp -a "$SRC/examples" examples
          cp -a "$SRC/packages" packages
          cp -a "$SRC/scripts" scripts
          cp -a "$SRC/state" state

          # Generated outputs are rebuilt, never imported as canonical source.
          find packages -type d -name dist -prune -exec rm -rf {} +
          find packages -type f -name worker-configuration.d.ts -delete

          # Production state belongs to the old Git history. Deployment stays disabled.
          rm -f state/ultimo-deploy.json
          rm -f scripts/deploy-workflow-token-contract.test.mjs

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          pkg.name = "powerfarm-platform";
          writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE

          cat >> .gitignore <<'EOF'

          # Canonical baseline: generated Worker outputs stay out of Git.
          packages/*/dist/
          packages/*/worker-configuration.d.ts
          EOF

          cat > state/migration-source.json <<'EOF'
          {
            "legacyRepository": "powerfarm/OLD-platform-NAO-USAR-os",
            "legacySnapshot": "350dc661bdd1c4d831e5eb1f6b9224a9050de88e",
            "cloudflareOsRepository": "cloudflare/cloudflare-os",
            "cloudflareOsCommit": "bf7f762d7fa73553284d731ab6a978d3ea17be24",
            "productionDeployControllerEnabled": false
          }
          EOF

      - name: Verify import boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/gatekeeper-identity/src/registry-client.ts
          test -f packages/powerfarm-engine/src/workspace-runtime.ts
          test -f scripts/guards/check-upstream-source.mjs
          test -f state/esperado.json
          test ! -f state/ultimo-deploy.json
          test ! -f scripts/deploy-workflow-token-contract.test.mjs
          test ! -e packages/gatekeeper-identity/worker-configuration.d.ts
          test "$(git ls-files -s cloudflare-os | awk '{print $1":"$2}')" = "160000:bf7f762d7fa73553284d731ab6a978d3ea17be24"
          git diff --check

      - name: Commit canonical source import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name powerfarm-ci
          git config user.email ci@powerfarm.app
          git add -A -- . ':!.github/workflows'
          git commit -m "feat: import reviewed Powerfarm v0.1 source baseline"
          git push origin HEAD:baseline/cloudflare-os-bf7f762
