name: Bootstrap full Cloudflare OS base

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-full-base-on-main.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baseline/full-cloudflare-os-clean
          fetch-depth: 0
          submodules: false
      - name: Rebuild branch from full upstream source
        run: bash scripts/bootstrap-full-base.sh
