name: Import full Cloudflare OS baseline

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/import-full-cloudflare-os.yml

permissions:
  contents: write

concurrency:
  group: import-full-cloudflare-os
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
      - name: Replace starter-shaped branch with complete Cloudflare OS
        run: bash scripts/bootstrap-full-base-v2.sh
